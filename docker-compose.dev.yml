services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: v79commerce
      POSTGRES_USER: v79commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v79commerce -d v79commerce"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://v79commerce:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/v79commerce?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["sh", "-c", "./node_modules/.bin/prisma db push --skip-generate && node apps/api/dist/server.js"]
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "apps/api/dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://v79commerce:${POSTGRES_PASSWORD:-change_me_local_only}@postgres:5432/v79commerce?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
