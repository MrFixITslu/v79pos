name: Release Check
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: ./scripts/release-check.sh
