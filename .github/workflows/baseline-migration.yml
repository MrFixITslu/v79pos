name: Generate Baseline Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/baseline-migration.yml'

permissions:
  contents: write

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: v79commerce
          POSTGRES_USER: v79commerce
          POSTGRES_PASSWORD: baseline_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U v79commerce -d v79commerce"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://v79commerce:baseline_test_password@localhost:5432/v79commerce?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and create lockfile
        run: pnpm install --frozen-lockfile=false

      - name: Validate Prisma schema
        run: |
          pnpm db:generate
          pnpm db:validate

      - name: Generate baseline migration
        run: |
          set -eu
          if find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql | grep -q .; then
            echo "A committed migration already exists; refusing to replace it." >&2
            exit 1
          fi
          migration_dir="prisma/migrations/20260925_baseline"
          mkdir -p "$migration_dir"
          pnpm prisma migrate diff             --from-empty             --to-schema-datamodel prisma/schema.prisma             --script > "$migration_dir/migration.sql"
          cat > prisma/migrations/migration_lock.toml <<'EOF'
          # Please do not edit this file manually
          # It should be added in your version-control system (e.g., Git)
          provider = "postgresql"
          EOF
          test -s "$migration_dir/migration.sql"
          grep -q 'CREATE TABLE' "$migration_dir/migration.sql"

      - name: Verify deploy on fresh PostgreSQL
        run: |
          pnpm prisma migrate deploy
          pnpm prisma migrate status
          pnpm build
          pnpm test
          pnpm lint

      - name: Commit verified migration and lockfile
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml prisma/migrations/20260925_baseline/migration.sql prisma/migrations/migration_lock.toml
          git diff --cached --quiet && exit 0
          git commit -m "Add verified Prisma baseline migration"
          git push
