services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: v79commerce
      POSTGRES_USER: v79commerce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U v79commerce -d v79commerce"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://v79commerce:${POSTGRES_PASSWORD}@postgres:5432/v79commerce?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "./node_modules/.bin/prisma migrate deploy"]
    restart: "no"

  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://v79commerce:${POSTGRES_PASSWORD}@postgres:5432/v79commerce?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: ["node", "apps/api/dist/server.js"]
    networks:
      default:
      proxy_network:
        aliases:
          - v79-commerce-api
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/ready"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://v79commerce:${POSTGRES_PASSWORD}@postgres:5432/v79commerce?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_healthy
    command: ["node", "apps/api/dist/worker.js"]
    restart: unless-stopped

networks:
  proxy_network:
    external: true
    name: ${PROXY_NETWORK:-proxy_network}

volumes:
  postgres_data:
  redis_data:
